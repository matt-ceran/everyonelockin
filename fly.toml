app = "everyonelockin"
primary_region = "sjc"

[build]

[deploy]
  release_command = "npm run db:migrate:prod"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
